[project]
name = "viralprinter"
version = "0.1.0"
description = "Composer + grader for short-form video: render a declarative timeline to mp4, and lint any short against viral-structure rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.scripts]
viralprinter = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viralprinter"]
force-include = { "cli.py" = "cli.py" }

[tool.pytest.ini_options]
testpaths = ["test"]
